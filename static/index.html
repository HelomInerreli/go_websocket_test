<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoChat - Chat em Grupo</title>
  <meta name="description" content="Chat em grupo em tempo real com Go e WebSockets, inspirado no WhatsApp Web.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Overlay de Login -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="app-logo">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <h2>Bem-vindo ao GoChat</h2>
        <p>Introduza o seu nome de utilizador para entrar no grupo partilhado em tempo real.</p>
      </div>
      
      <form id="login-form">
        <div class="avatar-preview-container">
          <div id="avatar-preview" class="user-avatar-large">?</div>
        </div>

        <div class="input-group">
          <label for="username-input">Nome de Utilizador</label>
          <input type="text" id="username-input" placeholder="Ex: Maria, Carlos, Alex..." maxlength="20" required autocomplete="off" autofocus>
        </div>

        <button type="submit" id="join-btn" class="btn-primary">
          <span>Entrar na Sala</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Interface Principal do Chat (Estilo WhatsApp Web) -->
  <div id="app-container" class="app-container hidden">
    <!-- Barra Lateral / Lista de Utilizadores -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <div class="user-profile-summary">
          <div id="my-avatar" class="user-avatar">U</div>
          <div class="user-info">
            <span id="my-username" class="username-title">Utilizador</span>
            <span class="user-status-online"><span class="status-dot"></span> Online</span>
          </div>
        </div>
      </header>

      <div class="sidebar-search">
        <div class="search-input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-users" placeholder="Pesquisar participante...">
        </div>
      </div>

      <div class="online-section-header">
        <span>PARTICIPANTES ONLINE</span>
        <span id="online-counter-badge" class="badge">0</span>
      </div>

      <ul id="user-list" class="user-list">
        <!-- Inserido dinamicamente via JS -->
      </ul>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="chat-area">
      <!-- Cabeçalho do Chat -->
      <header class="chat-header">
        <button id="toggle-sidebar-btn" class="icon-btn mobile-only" title="Ver Participantes">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="group-avatar">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>

        <div class="group-info">
          <h2>Sala Principal do Grupo</h2>
          <p id="chat-subtitle">A carregar participantes...</p>
        </div>

        <div class="header-actions">
          <button id="logout-btn" class="icon-btn danger" title="Sair do Chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Janela de Mensagens -->
      <div id="messages-container" class="messages-container">
        <div class="system-date-divider">
          <span>HOJE</span>
        </div>
        <!-- Mensagens serão inseridas aqui dinamicamente -->
      </div>

      <!-- Barra de Envio de Mensagem -->
      <footer class="chat-footer">
        <form id="message-form" class="message-form">
          <input type="text" id="message-input" placeholder="Escreva uma mensagem..." autocomplete="off" required>
          <button type="submit" id="send-btn" class="btn-send" title="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
